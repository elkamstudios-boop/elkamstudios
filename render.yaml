services:
  - name: elkam-studios
    type: web
    runtime: static
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@12.3.4 --activate &&
      pnpm install --frozen-lockfile &&
      PORT=5173 BASE_PATH=/ pnpm --filter @workspace/elkam-studios run build
    staticPublishPath: artifacts/elkam-studios/dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://elkam-api.onrender.com
    domains:
      - elkamstudios.com
      - www.elkamstudios.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - name: elkam-api
    type: web
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@12.3.4 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      # Set manually in the Render dashboard (Environment tab) after deploy:
      # your Neon Postgres connection string. Kept out of the blueprint so
      # it's never committed to the repo.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
